name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

# The stable toolchain is pinned by rust-toolchain.toml, not selected here:
# `rustup show` installs whatever that file names, and a bare `cargo ...`
# resolves through it. Do not reintroduce `dtolnay/rust-toolchain@stable` or
# `cargo +stable` for these jobs — both bypass the pin and reopen the drift
# between CI and local development that kept this workflow red for 30 runs.
# rustfmt is the deliberate exception: rustfmt.toml needs nightly-only options
# (wrap_comments, format_strings, imports_granularity, group_imports, ignore),
# so the format check runs under nightly. That nightly is pinned by date in
# `rustfmt-toolchain`, read by both this workflow and scripts/sync.py — do not
# replace it with `@nightly` or `cargo +nightly`, which float and would
# reintroduce the same drift on the formatting half.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Install pinned nightly (rustfmt only)
        run: rustup toolchain install "$(cat rustfmt-toolchain)" --profile minimal -c rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Format check
        run: cargo "+$(cat rustfmt-toolchain)" fmt -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test

  docgen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Run docgen
        run: cargo run --bin xtgeoip-docgen
      - name: Check generated files are up to date
        run: git diff --exit-code src/generated/ docs/generated/
