name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# There is deliberately no `schedule:` trigger. One was added on 2026-09-03
# and removed on 2026-09-04 after the reasoning was examined properly:
#
#  * Four of the five jobs read nothing but the repository. Same input, same
#    answer — running them on a Monday can only repeat what Friday's push
#    already said.
#  * `audit` genuinely differs, because its second input is the RustSec
#    database and that moves whether or not anyone pushes. But a cron is the
#    wrong instrument for it: GitHub disables scheduled workflows after 60
#    days of repository inactivity, silently, so the check evaporates exactly
#    in the long-idle case that motivates it — and eight weeks of green
#    followed by silence is indistinguishable from all-clear.
#
# Nor is Dependabot the answer here: updates are applied on the maintainer's
# terms and the advisory check stays local, so nothing server-side watches
# this repository on its own. That is a deliberate decision, not an omission
# — see TODO.md, MAINTENANCE / SUPPLY CHAIN, before proposing either.
#
# `cargo audit` below remains a push gate, which is the job a workflow is
# actually good at: refusing a vulnerable lockfile at the door.

env:
  CARGO_TERM_COLOR: always

# The stable toolchain is pinned by rust-toolchain.toml, not selected here:
# `rustup show` installs whatever that file names, and a bare `cargo ...`
# resolves through it. Do not reintroduce `dtolnay/rust-toolchain@stable` or
# `cargo +stable` for these jobs — both bypass the pin and reopen the drift
# between CI and local development that kept this workflow red for 30 runs.
# rustfmt is the deliberate exception: rustfmt.toml needs nightly-only options
# (wrap_comments, format_strings, imports_granularity, group_imports, ignore),
# so the format check runs under nightly. That nightly is pinned by date in
# `rustfmt-toolchain`, read by both this workflow and scripts/sync.py — do not
# replace it with `@nightly` or `cargo +nightly`, which float and would
# reintroduce the same drift on the formatting half.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Install pinned nightly (rustfmt only)
        run: rustup toolchain install "$(cat rustfmt-toolchain)" --profile minimal -c rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Format check
        run: cargo "+$(cat rustfmt-toolchain)" fmt -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test

  docgen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Run docgen
        run: cargo run --bin xtgeoip-docgen
      - name: Check generated files are up to date
        run: git diff --exit-code src/generated/ docs/generated/

  # Dependency advisories. Separate from `lint` so a vulnerable crate and a
  # clippy failure are never reported as one red X — they have different
  # owners and different fixes.
  #
  # This job compiles nothing: `cargo audit` reads Cargo.lock and the RustSec
  # database, so it needs neither the project nor its dependencies built. The
  # toolchain still installs, because rust-toolchain.toml applies to any cargo
  # invocation in the tree; that is a few seconds and keeps the command here
  # byte-identical to the one scripts/sync.py runs locally. Divergence between
  # the local and CI forms of a check is the failure this workflow already
  # learned the hard way.
  #
  # Severity policy lives in .cargo/audit.toml: vulnerabilities block,
  # unsound/unmaintained/yanked report. Do not add `-D warnings` here — see
  # the reasoning in that file.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit
