# Single source of truth for the Rust toolchain, for CI and local development
# alike.
#
# Before this file, CI resolved `dtolnay/rust-toolchain@stable` at run time
# while local work used whatever the rustup directory override pointed at.
# The two drifted four releases apart (1.98.0 vs 1.94.0) and the lint job was
# red for 30 consecutive runs on a lint that did not exist locally, so
# `scripts/sync.py`'s pre-commit clippy gate was silently weaker than CI.
# Pinning both sides makes a local `cargo clippy` authoritative again.
#
# Bump this deliberately, and read the new lints when you do — a scheduled
# bump is a better trigger for that review than a surprise red build.
#
# `rustfmt` is deliberately NOT listed as a component, and installing it here
# is a mistake. rustfmt.toml uses five nightly-only options — wrap_comments,
# format_strings, imports_granularity, group_imports, and `ignore`. A stable
# rustfmt discards all five with a warning and formats anyway; because `ignore`
# is among them it then rewrites `src/generated/`, which fails the
# docgen-check job rather than the lint job it came from. Measured 2026-09-02:
# stable and nightly rustfmt agree on every hand-written file in this tree, and
# disagree only about the generated ones.
#
# Omitting the component makes a bare `cargo fmt` fail loudly instead. The
# formatter runs under the dated nightly named in `rustfmt-toolchain`, which
# CI and `scripts/sync.py` both read. There is no stable escape: file-level
# `#![rustfmt::skip]` satisfies rustfmt but does not compile (E0658, custom
# inner attributes are unstable), and the per-item form would mean docgen
# emitting an attribute before every generated item.

# ── Is this pin stale? ───────────────────────────────────────────────────
#
#   curl -s https://static.rust-lang.org/dist/channel-rust-stable.toml \
#     | grep -m1 -A1 '^\[pkg\.rust\]$' | tail -1
#   curl -s https://static.rust-lang.org/dist/channel-rust-nightly.toml \
#     | grep -m1 '^date'
#
# report the newest stable version and the newest nightly date from the
# release manifests, installing nothing. Compare the first against the channel
# below and the second against `rustfmt-toolchain`. Not `rustup check`: it
# reports only floating channels that are installed, so it goes silent about
# stable on a machine that keeps nothing but this pin.
#
# It exists because pinning solved one problem and created another. Before
# the pin, CI floated and local did not, and the two silently drifted four
# releases apart. After it, nothing at all reports that the pin *itself* has
# aged — and a pin that is never revisited is just the old stale toolchain
# with better paperwork. Bump on a schedule you choose, not on one a red
# build chooses for you.

[toolchain]
channel = "1.98.0"
components = ["clippy"]
