[package]
name = "xtgeoip"
version = "0.4.1"
edition = "2024"
authors = ["Homer at hazensparkle.co.uk"]
repository = "https://github.com/HomerSlated/xtgeoip"
license = "MIT"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "docs/**", "conf/**"]
# Not a crates.io crate. The [lib] target exists so the binaries and their
# tests can share code (it is a compile-time rlib, never deployed); publishing
# it would expose an API this project does not intend to support, and would
# make some distro ecosystems generate a librust-xtgeoip-dev package.
publish = false

[dependencies]
blake3 = "1.5.5"
memmap2 = "0.9.5"
sha2 = "0.10.9"
zip = "8.1.0"
anyhow = "1.0.102"
reqwest = { version = "0.13.2", features = ["blocking", "json", "gzip", "rustls"] }
toml = "1.0.6"
# Already in the tree via reqwest (2.5.8); declared directly so config
# validation can reject a URL carrying userinfo. Adds no new code.
url = "2.5.8"
csv = "1.4.0"
memchr = "2.8.3"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.27.0"
tar = "0.4.45"
flate2 = "1.1.9"
clap = { version = "4.6.0", features = ["derive"] }
serde_json = "1.0.149"
log = "0.4.29"
syslog = "7.0.0"
time = { version = "0.3.47", features = ["macros", "local-offset"] }
chrono = "0.4.44"
fern = { version = "0.7.1", features = ["chrono"] }
# The six crates below are pinned exactly; everything above floats on a caret
# range. The rule is on-disk format, not security exposure — `reqwest` and
# `zip` are at least as exposed, and are not pinned.
#
# An encrypted credential blob (#103) sits in /etc/xtgeoip.conf indefinitely,
# and its format is whatever `argon2` and `chacha20poly1305` produced on the
# day it was written. A minor bump that changes a KDF default or an output
# framing detail breaks no build and fails no test — it makes every existing
# blob undecryptable, reported as the deliberately ambiguous "wrong passphrase
# or corrupt ciphertext". `secrecy` and `zeroize` shape the same blob in
# memory; `toml_edit` decides how the ciphertext is spliced into the
# operator's config without reformatting the rest of it.
#
# `rpassword` is on the credential path and is *not* pinned. That is the rule
# working, not an oversight: it reads a terminal and persists nothing.
#
# These constraints bind only when the lockfile is regenerated. Cargo.lock is
# committed and §3 of docs/design/packaging.md has recipes build `--locked`,
# so they guard against our own `cargo update`, not against downstream drift.
# Do not extend `=` to crates with no format contract — Debian re-resolves
# against its own packaged versions, and an `=` pin is the shape most likely
# to need patching downstream, which is a delta the maintainer then carries
# through every security update.
#
# serde-saphyr's `=` is documentation rather than constraint: under Cargo's
# caret rules `^0.0.29` already resolves to exactly 0.0.29.
serde-saphyr = "=0.0.29"
argon2 = "=0.5.3"
chacha20poly1305 = "=0.11.0"
secrecy = "=0.10.3"
zeroize = "=1.9.0"
toml_edit = "=0.25.13"
rpassword = "7.5.4"
libc = "0.2.186"
clap_complete = "4.6.11"


[dev-dependencies]
# `ipnetwork` parsed every CIDR in the build until O-001 replaced it with a
# byte parser. It stays as the differential oracle those parsers are checked
# against (`src/build.rs`, `cidr_to_range_ipv4`/`_ipv6`), which is only a
# test-time need — hence dev, not a runtime dependency.
ipnetwork = "0.21.1"
