version: 3.1

meta:
  program: xtgeoip
  summary: Build and manage xt_geoip data from MaxMind GeoLite2 CSVs.

proof:
  unique_maps_to: true
  full_branch_coverage: true

flags:
  b:
    long: backup
    kind: bool
    summary: Back up current database before replacing it.
  c:
    long: clean
    kind: bool
    summary: Clean working files before continuing.
  p:
    long: prune
    kind: bool
    summary: Prune retained artifacts for the current operation.
  f:
    long: force
    kind: bool
    summary: Force the relevant operation when supported.
  l:
    long: legacy
    kind: bool
    summary: Enable legacy mode.

# Options that apply to every command and carry no combination semantics.
#
# Deliberately NOT in `flags:` above. That map is the universe the guard
# bitmask is built from, and every entry in it must be referenced by some
# guard (`cli::contradiction::every_flag_is_referenced_by_some_guard`). These
# two constrain nothing and conflict with nothing except each other, so a bit
# in that mask would be a bit no guard could ever mention. They are declared
# here so the spec still describes the whole CLI surface, and checked against
# the man page by `cli::tests::global_options_are_documented`.
global_options:
  log_file:
    long: log-file
    kind: path
    summary: Write the log to PATH, overriding [logging] in the config.
  no_log:
    long: no-log
    kind: bool
    summary: Disable file logging, overriding [logging] in the config.

# Options belonging to one subcommand only. Neither part of the guard bitmask
# (they constrain nothing across commands) nor global, so they are declared
# here rather than in `flags:` or `global_options:`.
#
# Added 2026-09-05. Before that these four existed only in `cli.rs` and in the
# man-page template, so the spec's claim to describe the whole CLI surface was
# false, and `validate_manpage_template` would have had to carve them out —
# leaving the flags most likely to be renamed as the ones it could not check.
subcommand_options:
  conf:
    d:
      long: default
      kind: bool
      summary: Show the default (example) configuration.
    e:
      long: edit
      kind: bool
      summary: Open the system configuration in $EDITOR.
    s:
      long: show
      kind: bool
      summary: Show the current system configuration.
    c:
      long: set-credentials
      kind: bool
      summary: Prompt for MaxMind credentials and store them encrypted.

# Execution planning (#26/#27). Design: docs/design/26-spec-derived-planning.md
#
# Every plan the program can produce is a subsequence of one fixed order, so
# this is a rank per step plus membership per context — not a dependency graph.
# Verified over all 76 Action values. That is an observation about today's six
# steps, not an invariant: a future step that runs at different points in
# different commands would break the model.
plan:
  steps:
    backup:
      rank: 10
      param: backup_mode
      why: >-
        The one step that must precede everything else: it runs before
        anything is disturbed, so a failure later leaves a copy behind.
    prune_bin:
      rank: 20
      why: >-
        Prunes old binary tarballs, which only makes sense once the new backup
        exists — otherwise the retention count is off by one.
    fetch:
      rank: 30
      why: >-
        Acquire before destroying. Everything downstream depends on the
        archive being in hand.
    clean:
      rank: 40
      param: backup_mode
      why: >-
        Runs after the fetch (#24 stage 1, 2026-07-18). Cleaning first meant a
        network outage left output_dir empty with no replacement to install;
        fetching first means a failed run leaves the existing install intact.
    prune_csv:
      rank: 50
      why: >-
        Prunes old CSV archives once the current one has been fetched, for the
        same off-by-one reason as prune_bin.
    build:
      rank: 60
      why: >-
        Last: it consumes the fetch result and regenerates the manifest, which
        is what makes the newly written files owned.

  contexts:
    # No `always`: which steps run is entirely flag-driven, which is what
    # unifies Action::TopLevelBackup and Action::TopLevelClean under one entry.
    top_level:
      always: []
      selects: { b: backup, p: prune_bin, c: clean }
    fetch:
      always: [fetch]
      fetch_mode: remote
      selects: { p: prune_csv }
    build:
      always: [fetch, build]
      fetch_mode: local
      selects: { b: backup, p: prune_bin, c: clean }
    run:
      always: [fetch, build]
      fetch_mode: remote
      selects: { b: backup, c: clean, p: prune_csv }
    conf:
      always: []
      selects: {}

reason_templates:
  no_argument:
    text: "you must specify at least one argument"
  no_legacy_here:
    text: "you must specify build or run, for the --legacy option"
  no_force_alone:
    text: "you must specify --backup or --clean, for the --force option"
  force_ambiguous:
    text: "the --force option is ambiguous, you must specify exactly one of --backup or --clean"
  no_prune_alone:
    text: "you must specify fetch or --backup, for the --prune option"
  no_prune_clean:
    text: "you must specify fetch or --backup, for the prune option, and --clean does not support the --prune option"
  no_prune_clean_force:
    text: "you must specify fetch or --backup, for the prune option, --clean does not support the --prune option, and --prune does not support the --force option"
  no_prune_force:
    text: "--prune does not support the --force option"
  no_fetch_legacy:
    text: "fetch does not support the --legacy option"
  no_fetch_backup:
    text: "fetch does not support the --backup option"
  no_fetch_clean:
    text: "fetch does not support the --clean option"
  no_fetch_force:
    text: "fetch does not support the --force option"
  no_build_force:
    text: "build does not support the --force option"
  no_prune_backup:
    text: "you must specify --backup, for the --prune option"
  no_run_force:
    text: "run does not support the --force option"
  prune_target_ambiguous:
    text: "you must specify fetch or build separately, for the --prune option"
  missing_required_argument:
    text: "{command} requires {argument}"

error_cases:
  top_level_no_args: { maps_to: top_level_no_args }
  top_level_legacy: { maps_to: top_level_legacy }
  top_level_force_no_target: { maps_to: top_level_force_no_target }
  top_level_force_ambiguous: { maps_to: top_level_force_ambiguous }
  top_level_prune_no_target: { maps_to: top_level_prune_no_target }
  top_level_prune_with_clean: { maps_to: top_level_prune_with_clean }
  top_level_prune_clean_force: { maps_to: top_level_prune_clean_force }
  top_level_prune_force: { maps_to: top_level_prune_force }
  fetch_no_legacy: { maps_to: fetch_no_legacy }
  fetch_no_backup: { maps_to: fetch_no_backup }
  fetch_no_clean: { maps_to: fetch_no_clean }
  fetch_no_force: { maps_to: fetch_no_force }
  build_force_no_target: { maps_to: build_force_no_target }
  build_force_ambiguous: { maps_to: build_force_ambiguous }
  build_prune_no_backup: { maps_to: build_prune_no_backup }
  build_prune_force: { maps_to: build_prune_force }
  run_force_no_target: { maps_to: run_force_no_target }
  run_force_ambiguous: { maps_to: run_force_ambiguous }
  run_prune_force: { maps_to: run_prune_force }
  run_prune_ambiguous: { maps_to: run_prune_ambiguous }
  conf_missing_flag: { maps_to: conf_missing_flag }

top_level:
  kind: FlagCommand
  summary: Top level xtgeoip command
  allowed_flags: [b, c, p, f]
  reject:
    - { flag: l, error: top_level_legacy }
  guards:
    - { require: [p], forbid: [b, c], error: top_level_prune_no_target }
    - { require: [f], forbid: [b, c], error: top_level_force_no_target }
    - { require: [c, p, f], forbid: [b], error: top_level_prune_clean_force }
    - { require: [c, p], forbid: [b], error: top_level_prune_with_clean }
    - { require: [b, p, f], error: top_level_prune_force }
    - { require: [b, c, f], error: top_level_force_ambiguous }
  examples:
    - case_id: TL-001
      cmd: "xtgeoip"
      valid: false
      reason: { code: no_argument }
      maps_to: top_level_no_args
      exit_status: 1
    - case_id: TL-002
      cmd: "xtgeoip -h"
      valid: true
      outcome: "display usage"
    - case_id: TL-003
      cmd: "xtgeoip -l"
      valid: false
      reason: { code: no_legacy_here }
      maps_to: top_level_legacy
      exit_status: 1
    - case_id: TL-004
      cmd: "xtgeoip -f"
      valid: false
      reason: { code: no_force_alone }
      maps_to: top_level_force_no_target
      exit_status: 1
    - case_id: TL-005
      cmd: "xtgeoip -p"
      valid: false
      reason: { code: no_prune_alone }
      maps_to: top_level_prune_no_target
      exit_status: 1
    - case_id: TL-006
      cmd: "xtgeoip -b"
      valid: true
      outcome: "backup database"
      steps: [backup]
    - case_id: TL-007
      cmd: "xtgeoip -c"
      valid: true
      outcome: "clean database"
      steps: [clean]
      rebuild: true
    - case_id: TL-008
      cmd: "xtgeoip -b -c"
      valid: true
      outcome: "backup then clean"
      steps: [backup, clean]
      rebuild: true
    - case_id: TL-009
      cmd: "xtgeoip -b -p"
      valid: true
      outcome: "backup then prune"
      steps: [backup, prune_bin]
    - case_id: TL-010
      cmd: "xtgeoip -c -p"
      valid: false
      reason: { code: no_prune_clean }
      maps_to: top_level_prune_with_clean
      exit_status: 1
    - case_id: TL-011
      cmd: "xtgeoip -b -p -f"
      valid: false
      reason: { code: no_prune_force }
      maps_to: top_level_prune_force
      exit_status: 1
    - case_id: TL-012
      cmd: "xtgeoip -c -p -f"
      valid: false
      reason: { code: no_prune_clean_force }
      maps_to: top_level_prune_clean_force
      exit_status: 1
    - case_id: TL-013
      cmd: "xtgeoip -b -f"
      valid: true
      outcome: "force backup database"
      steps: [backup]
    - case_id: TL-014
      cmd: "xtgeoip -b -c -f"
      valid: false
      reason: { code: force_ambiguous }
      maps_to: top_level_force_ambiguous
      exit_status: 1
      rebuild: true
    - case_id: TL-015
      cmd: "xtgeoip -b -c -p"
      valid: true
      outcome: "backup then prune then clean"
      steps: [backup, prune_bin, clean]
      rebuild: true

commands:

  fetch:
    kind: FlagCommand
    summary: Fetch GeoLite2 data files
    allowed_flags: [p]
    reject:
      - { flag: l, error: fetch_no_legacy }
      - { flag: b, error: fetch_no_backup }
      - { flag: c, error: fetch_no_clean }
      - { flag: f, error: fetch_no_force }
    examples:
      - case_id: F-001
        cmd: "xtgeoip fetch"
        valid: true
        outcome: "fetch CSVs"
        steps: [fetch]
      - case_id: F-002
        cmd: "xtgeoip fetch -p"
        valid: true
        outcome: "fetch then prune archives"
        steps: [fetch, prune_csv]
      - case_id: F-003
        cmd: "xtgeoip fetch -l"
        valid: false
        reason: { code: no_fetch_legacy }
        maps_to: fetch_no_legacy
        exit_status: 1
      - case_id: F-004
        cmd: "xtgeoip fetch -b"
        valid: false
        reason: { code: no_fetch_backup }
        maps_to: fetch_no_backup
        exit_status: 1
      - case_id: F-005
        cmd: "xtgeoip fetch -c"
        valid: false
        reason: { code: no_fetch_clean }
        maps_to: fetch_no_clean
        exit_status: 1
      - case_id: F-006
        cmd: "xtgeoip fetch -f"
        valid: false
        reason: { code: no_fetch_force }
        maps_to: fetch_no_force
        exit_status: 1

  build:
    kind: FlagCommand
    summary: Build xt_geoip database
    allowed_flags: [b, c, p, f, l]
    guards:
      - { require: [f], forbid: [b, c], error: build_force_no_target }
      - { require: [p], forbid: [b], error: build_prune_no_backup }
      - { require: [p, f], error: build_prune_force }
      - { require: [b, c, f], error: build_force_ambiguous }
    examples:
      - case_id: B-001
        cmd: "xtgeoip build"
        valid: true
        outcome: "build database"
        steps: [fetch, build]
      - case_id: B-002
        cmd: "xtgeoip build -l"
        valid: true
        outcome: "build (legacy mode)"
        steps: [fetch, build]
      - case_id: B-003
        cmd: "xtgeoip build -b -p"
        valid: true
        outcome: "backup then prune then build"
        steps: [backup, prune_bin, fetch, build]
      - case_id: B-004
        cmd: "xtgeoip build -p"
        valid: false
        reason: { code: no_prune_backup }
        maps_to: build_prune_no_backup
        exit_status: 1
      - case_id: B-005
        cmd: "xtgeoip build -c -f"
        valid: true
        outcome: "clean then build"
        steps: [fetch, clean, build]
      - case_id: B-006
        cmd: "xtgeoip build -b -c -p"
        valid: true
        outcome: "backup, prune, clean, build"
        steps: [backup, prune_bin, fetch, clean, build]
      - case_id: B-007
        cmd: "xtgeoip build -b -p -f"
        valid: false
        reason: { code: no_prune_force }
        maps_to: build_prune_force
        exit_status: 1
      - case_id: B-008
        cmd: "xtgeoip build -f"
        valid: false
        reason: { code: no_build_force }
        maps_to: build_force_no_target
        exit_status: 1
      - case_id: B-009
        cmd: "xtgeoip build -b"
        valid: true
        outcome: "backup then build"
        steps: [backup, fetch, build]
      - case_id: B-010
        cmd: "xtgeoip build -c"
        valid: true
        outcome: "clean then build"
        steps: [fetch, clean, build]
      - case_id: B-011
        cmd: "xtgeoip build -b -c"
        valid: true
        outcome: "backup then clean then build"
        steps: [backup, fetch, clean, build]
      - case_id: B-012
        cmd: "xtgeoip build -b -f"
        valid: true
        outcome: "force backup then build"
        steps: [backup, fetch, build]
      - case_id: B-013
        cmd: "xtgeoip build -b -c -f"
        valid: false
        reason: { code: force_ambiguous }
        maps_to: build_force_ambiguous
        exit_status: 1

  run:
    kind: FlagCommand
    summary: Run full pipeline
    allowed_flags: [b, c, p, f, l]
    guards:
      - { require: [f], forbid: [b, c], error: run_force_no_target }
      - { require: [p, f], error: run_prune_force }
      # `-p` has two candidate targets here and only one is flag-driven:
      # `always: [fetch]` with `fetch_mode: remote` produces a new CSV
      # unasked, and `-b` adds a new binary tarball beside it in the same
      # archive_dir. Hence `[b, p]`, not `[b, c, p]` — `-c` plays no part
      # in choosing a prune target.
      - { require: [b, p], error: run_prune_ambiguous }
      - { require: [b, c, f], error: run_force_ambiguous }
    examples:
      - case_id: R-001
        cmd: "xtgeoip run"
        valid: true
        outcome: "fetch then build"
        steps: [fetch, build]
      - case_id: R-002
        cmd: "xtgeoip run -l"
        valid: true
        outcome: "fetch then build (legacy)"
        steps: [fetch, build]
      - case_id: R-003
        cmd: "xtgeoip run -p"
        valid: true
        outcome: "fetch then prune then build"
        steps: [fetch, prune_csv, build]
      - case_id: R-004
        cmd: "xtgeoip run -c -p"
        valid: true
        outcome: "fetch then clean then prune then build"
        steps: [fetch, clean, prune_csv, build]
      - case_id: R-005
        cmd: "xtgeoip run -c -f"
        valid: true
        outcome: "fetch then force clean then build"
        steps: [fetch, clean, build]
      - case_id: R-006
        cmd: "xtgeoip run -b -p -f"
        valid: false
        reason: { code: no_prune_force }
        maps_to: run_prune_force
        exit_status: 1
      - case_id: R-008
        cmd: "xtgeoip run -f"
        valid: false
        reason: { code: no_run_force }
        maps_to: run_force_no_target
        exit_status: 1
      - case_id: R-009
        cmd: "xtgeoip run -b"
        valid: true
        outcome: "backup then fetch then build"
        steps: [backup, fetch, build]
      - case_id: R-010
        cmd: "xtgeoip run -b -c"
        valid: true
        outcome: "backup then fetch then clean then build"
        steps: [backup, fetch, clean, build]
      - case_id: R-011
        cmd: "xtgeoip run -b -f"
        valid: true
        outcome: "force backup then fetch then build"
        steps: [backup, fetch, build]
      - case_id: R-012
        cmd: "xtgeoip run -b -p"
        valid: false
        reason: { code: prune_target_ambiguous }
        maps_to: run_prune_ambiguous
        exit_status: 1
      - case_id: R-013
        cmd: "xtgeoip run -b -c -f"
        valid: false
        reason: { code: force_ambiguous }
        maps_to: run_force_ambiguous
        exit_status: 1

  conf:
    kind: SelectorCommand
    summary: Manage configuration
    usage: "xtgeoip conf <-s|-d|-e|-c>"
    selector_flags:
      choices:
        s: { summary: "Show configuration" }
        d: { summary: "Show default (example) configuration" }
        e: { summary: "Edit configuration" }
        c: { summary: "Encrypt and store MaxMind account_id/license_key (#103)" }
    constraints:
      exactly_one_required: true
    examples:
      - case_id: C-001
        cmd: "xtgeoip conf"
        valid: false
        reason: { code: missing_required_argument }
        maps_to: conf_missing_flag
        exit_status: 1
      - case_id: C-002
        cmd: "xtgeoip conf -s"
        valid: true
        outcome: "show configuration"
        steps: []
      - case_id: C-003
        cmd: "xtgeoip conf -d"
        valid: true
        outcome: "show default configuration"
        steps: []
      - case_id: C-004
        cmd: "xtgeoip conf -e"
        valid: true
        outcome: "edit configuration"
        steps: []
      - case_id: C-005
        cmd: "xtgeoip conf -c"
        valid: true
        outcome: "prompt for and encrypt MaxMind credentials"
        steps: []
